<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SidePilot 助手</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<div class="pilot-app" id="app">

  <!-- 顶栏：品牌 + 项目名 + 操作 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">SidePilot</span>
      <span class="brand-sep">/</span>
      <span class="brand-project" id="projectName">加载中</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-link" id="historyBtn" title="历史对话">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M12 8v4l3 2"/>
          <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/>
          <path d="M3 4v4h4"/>
        </svg>
      </button>
      <button class="icon-link" id="newBtn" title="新对话">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <a class="ghost-link" id="docsLink" href="#" target="_blank">文档</a>
      <button class="ghost-link" id="closeBtn" title="收起">收起</button>
    </div>
  </header>

  <!-- 历史对话列表（覆盖层） -->
  <section class="history-view" id="historyView">
    <div class="history-head">
      <span>历史对话</span>
      <button class="ghost-link" id="historyBack">返回</button>
    </div>
    <div class="history-list" id="historyList">
      <p class="history-empty">还没有对话记录</p>
    </div>
  </section>

  <!-- 消息流 -->
  <main class="stream" id="stream">
    <!-- 首屏欢迎区，由脚本按项目画像填充 -->
    <section class="welcome" id="welcome">
      <p class="eyebrow" id="kindLabel">正在识别这个项目</p>
      <h1 class="welcome-title">有什么可以帮你？</h1>
      <p class="welcome-sub" id="capabilityHint"></p>
      <div class="suggestions" id="suggestions"></div>
    </section>
  </main>

  <!-- 输入区 -->
  <footer class="composer">
    <div class="attachments" id="attachments"></div>
    <div class="composer-row">
      <button class="icon-btn" id="imageBtn" title="上传图片">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="8.5" cy="9.5" r="1.5"/>
          <path d="M21 15l-5-5L5 20"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="问点什么，或者说「把首页那个价格改成 188」"></textarea>
      <button class="send-btn" id="sendBtn" title="发送">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 12h15M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <p class="composer-note">AI 可能出错，重要数据请核对。写操作会先请你确认。</p>
  </footer>
</div>

<script src="chat.js"></script>
</body>
</html>
